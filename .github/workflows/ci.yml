name: CI and release

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global yarn@1.22.22 --ignore-scripts
      - run: yarn install --frozen-lockfile --non-interactive --ignore-scripts
      - run: yarn lint
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_TAG" == "v$version" ]]
      - name: Lint workflows
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          -color .github/workflows/ci.yml
      - name: Lint Dockerfiles
        # Debian package versions deliberately follow security updates on rebuild.
        run: |
          for file in Dockerfile .docker/php/Dockerfile .docker/node/Dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.14.0-alpine@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c hadolint --ignore DL3008 - < "$file"
          done
      - name: Check Python test syntax
        run: python3 -m py_compile tests/container_smoke.py

  build-test:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build source image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: rainloop-ci:test
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Lint all shipped PHP
        run: |
          docker run --rm --network none --read-only --entrypoint sh rainloop-ci:test -ec \
            'find /rainloop /usr/local/share/rainloop -type f -name "*.php" -print0 | xargs -0 -n1 php -l' > php-lint.txt
          tail -n 5 php-lint.txt
      - name: Run runtime, HTTP and mail-library tests
        run: python3 tests/container_smoke.py --image rainloop-ci:test
      - name: Generate image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: rainloop-ci:test
          format: spdx-json
          output-file: rainloop.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Export the tested image for publishing
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: |
          docker image inspect rainloop-ci:test --format '{{.Id}}' > tested-image-id.txt
          docker save rainloop-ci:test | gzip -n > image.tar.gz
          sha256sum image.tar.gz rainloop.spdx.json tested-image-id.txt > SHA256SUMS
      - name: Transfer tested image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image
          path: |
            image.tar.gz
            tested-image-id.txt
            rainloop.spdx.json
            SHA256SUMS
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
      - name: Load and verify the tested image
        run: |
          sha256sum --check SHA256SUMS
          gzip -dc image.tar.gz | docker load
          test "$(docker image inspect rainloop-ci:test --format '{{.Id}}')" = "$(cat tested-image-id.txt)"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image and digest reference
        id: publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="${IMAGE,,}"
          tags=("sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags+=("${RELEASE_TAG#v}" latest)
          else
            tags+=(edge)
          fi
          for tag in "${tags[@]}"; do
            docker tag rainloop-ci:test "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          reference=$(docker image inspect "$IMAGE:${tags[0]}" --format '{{index .RepoDigests 0}}')
          [[ "$reference" == "$IMAGE@sha256:"* ]]
          printf '%s\n' "$reference" > image-reference.txt
          printf 'image=%s\ndigest=%s\n' "$IMAGE" "${reference#*@}" >> "$GITHUB_OUTPUT"
          printf 'Tested image: %s\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum image-reference.txt rainloop.spdx.json > release-SHA256SUMS
          printf 'Tested linux/amd64 image:\n\n%s\n\nRequires container port 8080 and writable /rainloop/data owned by UID 33.\n' "$(cat image-reference.txt)" > release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" image-reference.txt rainloop.spdx.json release-SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes \
              --notes-file release-notes.md image-reference.txt rainloop.spdx.json release-SHA256SUMS
          fi
