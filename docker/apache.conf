ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8080>
    DocumentRoot /rainloop
    DirectoryIndex index.php
    <Directory /rainloop>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /rainloop/data>
        Require all denied
    </Directory>
    <DirectoryMatch "^/rainloop/rainloop/v/[^/]+/app(?:/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "(?i)^(include\.php|check\.php|index\.php\.root|.*\.(ini|log|sql|bak|ya?ml))$">
        Require all denied
    </FilesMatch>
    Alias /healthz /usr/local/share/rainloop/healthcheck.php
    <Directory /usr/local/share/rainloop>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
